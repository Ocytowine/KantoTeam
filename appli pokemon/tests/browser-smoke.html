<!doctype html>
<meta charset="utf-8">
<title>KantoTeam smoke test</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="../index.html" hidden></iframe>
<script>
  const result = document.querySelector("#result");
  const frame = document.querySelector("#app");
  const wait = (ms = 80) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const loaded = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));

  (async () => {
    await loaded();
    const win = frame.contentWindow;
    win.localStorage.clear();
    const base = {
      selectedSlot: 0,
      activeView: "slots",
      teams: [null, null, null],
      customPokemon: [],
      sharedTeams: []
    };
    win.localStorage.setItem("kantoTeamState:v2", JSON.stringify({
      schemaVersion: 2,
      activeGame: "reforged",
      games: {
        reforged: { ...base, teams: [{ name: "Equipe Reforged", preferredSource: "reforged", pokemon: [], reservePokemonIds: [] }, null, null] },
        "pokemon-z": { ...base, teams: [{ name: "Equipe Z", preferredSource: "pokemon-z", pokemon: [], reservePokemonIds: [] }, null, null] }
      }
    }));
    const reloaded = loaded();
    win.location.reload();
    await reloaded;
    await wait();

    const doc = frame.contentDocument;
    assert(doc.querySelectorAll("#team-slots .slot-card").length === 3, "Reforged doit afficher 3 slots");
    assert(doc.querySelector("#team-slots").textContent.includes("Equipe Reforged"), "Equipe Reforged absente");
    doc.querySelector("#game-version-toggle").click();
    await wait(800);
    assert(doc.querySelectorAll("#team-slots .slot-card").length === 3, "Pokemon Z doit afficher 3 slots");
    assert(doc.querySelector("#team-slots").textContent.includes("Equipe Z"), "Equipe Z absente");
    assert(!doc.querySelector("#team-slots").textContent.includes("Equipe Reforged"), "Melange entre les banques");
    assert(doc.body.dataset.gameTheme === "pokemon-z", "Palette Pokemon Z non activee");
    assert(doc.querySelector("#app-title-logo").getAttribute("src") === "assets/Titre_Pokemon_Z.png", "Logo Pokemon Z non charge");
    assert(doc.querySelector("#catalog-select").options.length === 1018, "Catalogue Pokemon Z incomplet");
    const stored = JSON.parse(win.localStorage.getItem("kantoTeamState:v2"));
    assert(stored.activeGame === "pokemon-z", "Version active non persistee");
    assert(stored.games.reforged.teams.length === 3 && stored.games["pokemon-z"].teams.length === 3, "Les 6 slots ne sont pas repartis en 3 + 3");
    doc.querySelector("#open-pokemon-search").click();
    assert(doc.querySelector("#game-version-switch").classList.contains("hidden"), "Le switch reste visible hors de la selection d'equipe");
    const query = doc.querySelector("#pokemon-search-query");
    query.value = "Bulb";
    query.dispatchEvent(new win.Event("input", { bubbles: true }));
    await wait();
    const infoButton = doc.querySelector("#pokemon-search-results [data-pokemon-info-name]");
    assert(infoButton, "Bouton du guide d'obtention absent");
    infoButton.click();
    await wait(1800);
    assert(doc.querySelector("#pokemon-search-results .pokemon-acquisition-method"), "Guide d'obtention Pokemon Z non affiche");

    win.localStorage.clear();
    const legacy = {
      ...base,
      teams: [
        { name: "Ancienne Reforged", preferredSource: "reforged", pokemon: [], reservePokemonIds: [] },
        { name: "Ancienne Z", preferredSource: "pokemon-z", pokemon: [], reservePokemonIds: [] },
        { name: "Ancienne classique", preferredSource: "official", pokemon: [], reservePokemonIds: [] }
      ]
    };
    win.localStorage.setItem("kantoTeamState:v1", JSON.stringify(legacy));
    const migratedReload = loaded();
    win.location.reload();
    await migratedReload;
    await wait();
    const migrated = JSON.parse(win.localStorage.getItem("kantoTeamState:v2"));
    assert(win.localStorage.getItem("kantoTeamState:legacy:v1") === JSON.stringify(legacy), "Sauvegarde de securite v1 absente");
    assert(migrated.games.reforged.teams[0]?.name === "Ancienne Reforged", "Migration Reforged incorrecte");
    assert(migrated.games["pokemon-z"].teams[1]?.name === "Ancienne Z", "Migration Pokemon Z incorrecte");
    assert(!JSON.stringify(migrated).includes("Ancienne classique"), "Une equipe Kanto classique a ete injectee dans un profil");
    result.textContent = "PASS";
  })().catch((error) => {
    result.textContent = `FAIL: ${error.message}`;
  });
</script>
