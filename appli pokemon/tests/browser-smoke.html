<!doctype html>
<meta charset="utf-8">
<title>KantoTeam smoke test</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="../index.html" hidden></iframe>
<script>
  const result = document.querySelector("#result");
  const frame = document.querySelector("#app");
  const wait = (ms = 80) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const loaded = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));

  (async () => {
    await loaded();
    const win = frame.contentWindow;
    win.localStorage.clear();
    const base = {
      selectedSlot: 0,
      activeView: "slots",
      teams: [null, null, null],
      customPokemon: [],
      sharedTeams: []
    };
    win.localStorage.setItem("kantoTeamState:v2", JSON.stringify({
      schemaVersion: 2,
      activeGame: "reforged",
      games: {
        reforged: { ...base, teams: [{ name: "Equipe Reforged", preferredSource: "reforged", pokemon: [], reservePokemonIds: [] }, null, null] },
        "pokemon-z": {
          ...base,
          teams: [{ name: "Equipe Z", preferredSource: "pokemon-z", pokemon: [{ instanceId: "z-bulbizarre", sourceId: "pokemon-z-1", pokemonZId: "pokemon-z-1", nationalId: 1, name: "Bulbizarre", types: ["Plante", "Poison"], attacks: ["Plante", "Poison"] }], reservePokemonIds: [] }, null, null],
          sharedTeams: [{
            id: "shared-test",
            name: "Equipe reçue",
            savedName: "Equipe reçue",
            senderName: "Alice",
            preferredSource: "pokemon-z",
            favoritePokemonInstanceId: "shared-pikachu",
            pokemon: [
              { instanceId: "shared-bulbizarre", sourceId: "pokemon-z-1", pokemonZId: "pokemon-z-1", nationalId: 1, name: "Bulbizarre", types: ["Plante", "Poison"], attacks: ["Plante"] },
              { instanceId: "shared-pikachu", sourceId: "pokemon-z-25", pokemonZId: "pokemon-z-25", nationalId: 25, name: "Pikachu", types: ["Electrik", "Combat"], attacks: ["Electrik"] }
            ]
          }]
        }
      }
    }));
    const reloaded = loaded();
    win.location.reload();
    await reloaded;
    await wait();

    const doc = frame.contentDocument;
    const accountButton = doc.querySelector("#account-button");
    assert(accountButton, "Le bouton de connexion cloud est absent");
    assert(accountButton.textContent.trim() === "Hors connexion", "Le badge cloud hors connexion n'est pas explicite");
    assert(win.getComputedStyle(accountButton).justifyContent === "center", "Le pseudo du compte n'est pas centre dans son badge");
    accountButton.click();
    await wait();
    assert(doc.querySelector("#account-modal:not(.hidden) [data-account-form='login']"), "La modale de connexion ne s'ouvre pas");
    assert(doc.querySelector("#account-modal").textContent.includes("sauvegardes locales restent accessibles"), "Le mode hors connexion cloud n'est pas explique");
    doc.querySelector("#account-modal [data-account-close]").click();
    assert(doc.querySelector("#account-modal").classList.contains("hidden"), "La modale de connexion ne se ferme pas");
    assert(doc.querySelectorAll("#team-slots .slot-card").length === 3, "Reforged doit afficher 3 slots");
    const emptyTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/add-team-pokeball.png']");
    assert(emptyTeamPokeball, "L'icone add-team-pokeball n'est pas affectee au slot libre");
    assert(!emptyTeamPokeball.closest(".empty-team-slot").textContent.trim(), "Le slot d'equipe libre contient encore du texte");
    assert(parseFloat(win.getComputedStyle(emptyTeamPokeball).width) >= 82, "Le logo du slot d'equipe libre n'est pas agrandi");
    const filledTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/team-pokeball.png']");
    assert(filledTeamPokeball, "L'icone team-pokeball n'est pas affectee a l'equipe existante");
    assert(filledTeamPokeball.dataset.themeFallback === "assets/pokeball.png", "Le repli de team-pokeball est absent");
    assert(doc.querySelector("#team-slots").textContent.includes("Equipe Reforged"), "Equipe Reforged absente");
    assert(!win.getPokemonSpriteSources({ id: 25, name: "Pikachu", nationalId: 25, origin: "reforged" }).small.includes("pokemon-z-sprites"), "Les sprites Z contaminent la version Reforged");
    const reforgedActionLabel = doc.querySelector("#team-slots .slot-action-wheel text");
    const reforgedLabelStyle = win.getComputedStyle(reforgedActionLabel);
    assert(reforgedLabelStyle.fontFamily === win.getComputedStyle(doc.body).fontFamily && reforgedLabelStyle.stroke === "none", "Le texte des commandes de slot ne reprend pas le style de l'application");
    doc.querySelector("#game-version-toggle").click();
    await wait(800);
    assert(doc.querySelectorAll("#team-slots .slot-card").length === 3, "Pokemon Z doit afficher 3 slots");
    assert(doc.querySelector("#team-slots").textContent.includes("Equipe Z"), "Equipe Z absente");
    assert(!doc.querySelector("#team-slots").textContent.includes("Equipe Reforged"), "Melange entre les banques");
    assert(!doc.querySelector("#team-slots").textContent.includes("Slot 1"), "La mention Slot 1 est encore affichée");
    assert(!doc.querySelector("#team-slots").textContent.includes("v2.12"), "Le nom de version est encore répété dans le slot");
    assert(!doc.querySelector("#team-slots [data-action='delete']"), "La poubelle est encore affichée dans les slots");
    assert(doc.querySelector("#team-slots [data-action='composition']")?.getAttribute("aria-label") === "Gestion", "Le bouton Gestion conserve un libellé trop long");
    assert(doc.body.dataset.gameTheme === "pokemon-z", "Palette Pokemon Z non activee");
    assert(doc.querySelector("#open-shared-teams img")?.getAttribute("src") === "assets/share-pokeball_z.webp", "Logo share-pokeball Z absent du partage");
    assert(win.getComputedStyle(doc.querySelector("#open-type-helper")).getPropertyValue("--feature-rgb").trim() === "126, 142, 255", "Couleur du Guide des types absente");
    assert(win.getComputedStyle(doc.querySelector("#manage-saved-pokemon")).getPropertyValue("--feature-rgb").trim() === "74, 197, 132", "Couleur des Pokemon sauvegardes absente");
    const zEmptyTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/add-team-pokeball.png']");
    assert(zEmptyTeamPokeball?.getAttribute("src") === "assets/add-team-pokeball_z.png", "La variante Z de add-team-pokeball n'est pas chargee");
    const zFilledTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/team-pokeball.png']");
    assert(zFilledTeamPokeball?.getAttribute("src").endsWith("_z.png"), "La variante Z de l'icone d'equipe n'est pas chargee");
    assert(win.getComputedStyle(doc.querySelector("#team-slots"), "::before").backgroundImage.includes("Titre_Pokemon_Z.png"), "Le titre Pokemon Z n'est pas intégré au fond des slots");
    win.openView("sharedTeams");
    assert(doc.querySelectorAll("#shared-teams-list .shared-team-slot-card").length === 3, "Les équipes partagées ne reprennent pas les trois slots circulaires");
    assert(doc.querySelectorAll("#shared-teams-list .shared-team-empty-slot").length === 2, "Les emplacements partagés libres sont absents");
    const sharedSlot = doc.querySelector("#shared-teams-list .shared-team-slot-card:not(.empty)");
    assert(win.getComputedStyle(sharedSlot).borderRadius === "50%" && sharedSlot.querySelectorAll(".slot-action-wheel textPath").length === 3, "Le slot partagé ne reprend pas le visuel circulaire principal");
    assert(sharedSlot.querySelector(".team-slot-info-wheel")?.textContent.includes("Alice"), "Le nom de l'expéditeur n'est pas affiché sur le slot partagé");
    sharedSlot.querySelector("[data-open-shared-team]").click();
    assert(doc.querySelectorAll("#shared-teams-list .shared-team-detail-pokemon .pokemon-card").length === 2, "Les Pokémon partagés ne sont pas présentés sous forme de cartes");
    assert(!doc.querySelector("#shared-teams-list .shared-team-detail-pokemon .library-kind"), "La version est encore affichée dans les cartes partagées");
    win.openView("slots");
    assert(doc.querySelector("#catalog-select").options.length === 1018, "Catalogue Pokemon Z incomplet");
    assert(win.getPokemonBaseStats({ id: "pokemon-z-1", nationalId: 1 }).hp === 50, "Les statistiques propres a Pokemon Z ne sont pas utilisees");
    const wikiButton = doc.querySelector("#open-pokemon-z-wiki");
    assert(wikiButton && !wikiButton.classList.contains("hidden"), "Le raccourci du wiki Pokemon Z est absent");
    assert(wikiButton.querySelector(".pokemon-z-guide-nav-logo")?.getAttribute("src") === "assets/Guide_z.webp", "Le vrai logo du Guide Pokemon Z n'est pas integre");
    const visibleHeaderButtons = Array.from(doc.querySelectorAll(".header-actions .icon-nav-button:not(.hidden)"));
    assert(new Set(visibleHeaderButtons.map((button) => button.offsetTop)).size === 1, "Les logos principaux passent sur plusieurs lignes sur mobile");
    wikiButton.click();
    for (let attempt = 0; attempt < 20 && !doc.querySelector(".pokemon-z-wiki-home-grid"); attempt += 1) await wait(100);
    assert(doc.querySelector(".pokemon-z-wiki-home-grid"), "Le chargement differe du wiki a echoue");
    doc.querySelector('[data-wiki-category="machines"]').click();
    const wikiQuery = doc.querySelector("#pokemon-z-wiki-query");
    const setWikiFilter = (name, value) => {
      const select = doc.querySelector(`[data-wiki-machine-filter="${name}"]`);
      select.value = value;
      select.dispatchEvent(new win.Event("change", { bubbles: true }));
    };
    setWikiFilter("type", "Eau");
    setWikiFilter("category", "Spéciale");
    setWikiFilter("power", "80-99");
    setWikiFilter("availability", "direct");
    const filteredMachines = Array.from(doc.querySelectorAll("#pokemon-z-wiki-content .pokemon-z-wiki-machine-card"));
    assert(filteredMachines.length > 0, "Les filtres CT/CS cumules ne renvoient aucun resultat");
    assert(filteredMachines.every((card) => card.textContent.includes("Eau") && card.textContent.includes("Spéciale")), "Les filtres CT/CS ne se cumulent pas correctement");
    assert(filteredMachines[0].querySelector(".wiki-learnset-details")?.hidden, "Le detail d'une CT/CS n'est pas replie par defaut");
    doc.querySelector("[data-wiki-reset-machine-filters]").click();
    wikiQuery.value = "Surf";
    wikiQuery.dispatchEvent(new win.Event("input", { bubbles: true }));
    assert(doc.querySelector("#pokemon-z-wiki-content").textContent.includes("CS03"), "La recherche CT/CS ne trouve pas Surf");
    const machineToggle = doc.querySelector("#pokemon-z-wiki-content [data-wiki-machine-entry]");
    machineToggle.click();
    assert(machineToggle.getAttribute("aria-expanded") === "true" && !machineToggle.closest(".pokemon-z-wiki-machine-card").querySelector(".wiki-learnset-details").hidden, "Le detail d'une CT/CS ne se deplie pas au clic");
    doc.querySelector("#pokemon-z-wiki-content [data-wiki-machine-compatibility]").click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content [data-wiki-pokemon-id]").length > 100, "La compatibilite de Surf est incomplete");
    wikiQuery.value = "Gyroballe";
    wikiQuery.dispatchEvent(new win.Event("input", { bubbles: true }));
    assert(doc.querySelector("#pokemon-z-wiki-content .wiki-machine-stats")?.textContent.includes("??"), "Une CT a puissance variable affiche encore une fausse valeur fixe");
    doc.querySelector('[data-wiki-category="leaders"]').click();
    wikiQuery.value = "";
    wikiQuery.dispatchEvent(new win.Event("input", { bubbles: true }));
    assert(doc.querySelector("#pokemon-z-progress-badges"), "Les chefs sont révélés avant le questionnaire anti-spoiler");
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .pokemon-z-wiki-leader-card").length === 0, "Des chefs futurs sont affichés sans progression");
    doc.querySelector('[data-wiki-category="quests"]').click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-quest-card").length === 45, "Les 45 missions ne sont pas affichees");
    doc.querySelector('[data-wiki-category="crafting"]').click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-recipe-card").length === 3, "Les trois recettes initiales ne sont pas seules affichees");
    assert(!doc.querySelector("#pokemon-z-wiki-content").textContent.includes("Hyper Ball maison"), "Une recette non debloquee est revelee");
    assert(doc.querySelector("#pokemon-z-wiki-content .wiki-spoiler-notice"), "La protection anti-spoiler de l'alchimie est absente");
    const firstRecipe = doc.querySelector("#pokemon-z-wiki-content .wiki-recipe-card");
    assert(!firstRecipe.open, "Le detail d'une recette n'est pas replie par defaut");
    assert(!doc.querySelector("#pokemon-z-wiki-content .wiki-copy-button"), "Un bouton Copier est encore affiche dans l'alchimie");
    firstRecipe.querySelector("summary").click();
    assert(firstRecipe.open, "Le detail d'une recette ne se deplie pas au clic");
    assert(firstRecipe.querySelector("li small")?.textContent.trim(), "La description d'un ingredient est absente");
    wikiQuery.value = "Hyper Ball";
    wikiQuery.dispatchEvent(new win.Event("input", { bubbles: true }));
    assert(!doc.querySelector("#pokemon-z-wiki-content").textContent.includes("Hyper Ball maison"), "La recherche revele une recette verrouillee");
    wikiQuery.value = "";
    wikiQuery.dispatchEvent(new win.Event("input", { bubbles: true }));
    doc.querySelector('[data-wiki-category="items"]').click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-item-card").length > 3, "Les objets et composants initiaux sont incomplets");
    assert(doc.querySelector("#pokemon-z-wiki-content").textContent.normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes("Poke Balls"), "La categorie Pokeballs est absente");
    assert(!doc.querySelector("#pokemon-z-wiki-content").textContent.includes("Hyper Ball maison"), "Un objet non debloque est revele dans l'inventaire");
    const firstItemCard = doc.querySelector("#pokemon-z-wiki-content .wiki-item-card");
    assert(firstItemCard.querySelector(".wiki-item-details").hidden, "Le detail d'un objet n'est pas replie par defaut");
    firstItemCard.querySelector("[data-wiki-item-entry]").click();
    assert(!firstItemCard.querySelector(".wiki-item-details").hidden, "Le detail d'un objet ne se deplie pas au clic");
    assert(firstItemCard.textContent.includes("50% plus efficace"), "La description exacte de la Poke Ball maison est absente");
    const itemRecipeButton = doc.querySelector("#pokemon-z-wiki-content [data-wiki-item-recipes]");
    itemRecipeButton.click();
    assert(doc.querySelector('[data-wiki-category="crafting"]').classList.contains("active"), "Le lien d'un objet ne revient pas vers l'alchimie");
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-recipe-card").length >= 1, "Le lien d'un objet ne trouve aucune recette");
    wikiQuery.value = "";
    wikiQuery.dispatchEvent(new win.Event("input", { bubbles: true }));
    doc.querySelector('[data-wiki-category="items"]').click();
    doc.querySelector("[data-wiki-toggle-full-items]").click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-item-card").length === 792, "Le catalogue complet hors CT/CS n'est pas accessible");
    const calciumCard = Array.from(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-item-card"))
      .find((card) => card.querySelector("h3")?.textContent === "Calcium");
    assert(calciumCard, "La fiche du Calcium est absente");
    calciumCard.querySelector("[data-wiki-item-entry]").click();
    assert(calciumCard.querySelector(".wiki-item-measured-effect")?.textContent.includes("+10 EV en Attaque Spéciale"), "L'effet chiffre du Calcium n'est pas affiche");
    const heldUsageFilter = doc.querySelector('[data-wiki-item-filter="usage"]');
    heldUsageFilter.value = "held";
    heldUsageFilter.dispatchEvent(new win.Event("change", { bubbles: true }));
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-item-card").length > 200, "Les objets à tenir ne sont pas correctement recensés");
    doc.querySelector("[data-wiki-reset-item-filters]").click();
    const effectFilter = doc.querySelector('[data-wiki-item-filter="effect"]');
    effectFilter.value = "type-offense";
    effectFilter.dispatchEvent(new win.Event("change", { bubbles: true }));
    const itemTypeFilter = doc.querySelector('[data-wiki-item-filter="type"]');
    itemTypeFilter.value = "Feu";
    itemTypeFilter.dispatchEvent(new win.Event("change", { bubbles: true }));
    const fireHeldItems = Array.from(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-item-card"), (card) => card.textContent);
    assert(fireHeldItems.some((text) => text.includes("Charbon")), "Le filtre de puissance Feu ne retrouve pas le Charbon");
    assert(fireHeldItems.some((text) => text.includes("Plaque Flamme")), "Le filtre de puissance Feu ne retrouve pas la Plaque Flamme");
    doc.querySelector('[data-wiki-category="mechanics"]').click();
    assert(doc.querySelector("#pokemon-z-wiki-content").textContent.includes("bonus STAB"), "L'explication du STAB est absente des mecaniques");
    assert(doc.querySelector("#pokemon-z-wiki-content").textContent.includes(`${String.fromCharCode(215)}4`), "Les doubles faiblesses ne sont pas expliquees");
    doc.querySelector('[data-wiki-category="tips"]').click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-tip-card").length === 39, "Les astuces uniques sont incompletes");
    doc.querySelector('[data-wiki-category="progression"]').click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-achievement-card").length === 27, "Les 27 succes ne sont pas affiches");
    doc.querySelector('[data-wiki-category="adventure"]').click();
    assert(doc.querySelector("#pokemon-z-progress-badges"), "Le questionnaire anti-spoiler n'est pas propose avant le guide");
    doc.querySelector("#pokemon-z-progress-badges").value = "1";
    doc.querySelector("#pokemon-z-progress-level").value = "24";
    doc.querySelector("[data-save-pokemon-z-progress]").click();
    const adventureContent = doc.querySelector("#pokemon-z-wiki-content");
    assert(adventureContent.querySelector(".wiki-progress-profile")?.textContent.includes("1 badge"), "La progression anti-spoiler n'est pas enregistree");
    assert(adventureContent.querySelectorAll(".wiki-story-timeline article").length === 2, "Le guide revele un nombre incorrect d'etapes");
    assert(!adventureContent.textContent.includes("Route 23"), "Une page d'alchimie future est revelee");
    const alchemyPage = adventureContent.querySelector("[data-pokemon-z-alchemy-page]");
    assert(alchemyPage, "La checklist des pages d'alchimie accessibles est vide");
    alchemyPage.checked = true;
    alchemyPage.dispatchEvent(new win.Event("change", { bubbles: true }));
    assert(JSON.parse(win.localStorage.getItem("kantoTeam:pokemonZAlchemy:v1")).includes(alchemyPage.dataset.pokemonZAlchemyPage), "La checklist d'alchimie n'est pas persistee");
    doc.querySelector('[data-wiki-category="leaders"]').click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .pokemon-z-wiki-leader-card").length === 1, "Le palier anti-spoiler ne révèle pas exactement le premier chef");
    assert(doc.querySelector("#pokemon-z-wiki-content").textContent.includes("Annelotte"), "Le premier chef débloqué est absent");
    doc.querySelector('[data-wiki-category="crafting"]').click();
    assert(doc.querySelectorAll("#pokemon-z-wiki-content .wiki-recipe-card").length === 4, "Une page cochee ne debloque pas exactement la recette suivante");
    assert(doc.querySelector("#pokemon-z-wiki-content").textContent.includes("Poudre Explosive"), "La premiere recette gagnee reste masquee");
    doc.querySelector("#back-to-slots").click();
    await wait();
    const mobileNavLabel = win.getComputedStyle(doc.querySelector("#open-type-helper"), "::after");
    assert(mobileNavLabel.display !== "none" && Number(mobileNavLabel.opacity) > 0.8, "Le libelle mobile des raccourcis n'est pas visible");
    assert(mobileNavLabel.content.includes("Guide des types"), "Le libelle mobile ne reprend pas le nom du raccourci");
    const roucoolGuide = win.getPokemonZGuideInfo("pokemon-z-16");
    assert(roucoolGuide.methods.filter((method) => method.kind === "capture").length === 1, "La capture de Roucool est affichee en double");
    assert(roucoolGuide.methods.some((method) => method.text.includes("niveaux 5 à 6")), "La capture interne detaillee de Roucool n'est pas prioritaire");
    const carvanhaGuide = win.getPokemonZGuideInfo("pokemon-z-318");
    assert(carvanhaGuide.methods.some((method) => method.kind === "capture"), "La capture interne de Carvanha est absente");
    assert(carvanhaGuide.methods.some((method) => method.kind === "breeding"), "La reproduction documentee de Carvanha a ete supprimee");
    const mewtwoGuide = win.getPokemonZGuideInfo("pokemon-z-150");
    assert(mewtwoGuide.methods.some((method) => method.kind === "capture"), "La capture de Mewtwo disponible uniquement dans le guide a ete supprimee");
    const scalpionEvolution = win.getPokemonZEvolutionRequirement(
      win.POKEMON_Z_V212?.find((pokemon) => pokemon.id === "pokemon-z-625") || { id: "pokemon-z-625" },
      [{ min_level: 52 }]
    );
    assert(scalpionEvolution.includes("30"), "Le niveau d'evolution Z de Scalpion n'est pas prioritaire");
    assert(!scalpionEvolution.includes("52"), "Le niveau officiel 52 ecrase encore la regle Pokemon Z");
    const scalproieEvolution = win.getPokemonZEvolutionRequirement(
      win.POKEMON_Z_V212?.find((pokemon) => pokemon.id === "pokemon-z-985") || { id: "pokemon-z-985" },
      [{ trigger: { name: "level-up" } }]
    );
    assert(scalproieEvolution.includes("42"), "La condition Z de Scalpereur est absente");
    assert(!scalproieEvolution.toLowerCase().includes("bisharp"), "Le nom Bisharp n'est pas traduit dans la condition Z");
    const rioluGuide = win.getPokemonZGuideInfo("pokemon-z-447");
    const rioluTrades = rioluGuide.methods.filter((method) => method.kind === "trade");
    assert(rioluTrades.some((method) => method.text.includes("Charpenti") && method.text.includes("niveau 20")), "L'echange interne Riolu/Charpenti est absent");
    assert(rioluTrades.some((method) => method.text.includes("Galeking") && method.text.includes("niveau 80")), "Le second echange interne de Riolu est absent");
    const pachirisuGuide = win.getPokemonZGuideInfo("pokemon-z-417");
    assert(pachirisuGuide.methods.some((method) => method.kind === "trade" && method.text.includes("Morpeko") && method.text.includes("niveau 85")), "L'echange interne Pachirisu/Morpeko est absent");
    const hoopaGuide = win.getPokemonZGuideInfo("pokemon-z-720");
    assert(hoopaGuide.methods.some((method) => method.kind === "special" && method.text.includes("600 jetons")), "Le coût interne de Hoopa est incorrect");
    assert(!hoopaGuide.methods.some((method) => method.text.includes("1400")), "L'ancien coût erroné de Hoopa est encore affiché");
    const stored = JSON.parse(win.localStorage.getItem("kantoTeamState:v2"));
    assert(stored.activeGame === "pokemon-z", "Version active non persistee");
    assert(stored.games.reforged.teams.length === 3 && stored.games["pokemon-z"].teams.length === 3, "Les 6 slots ne sont pas repartis en 3 + 3");
    doc.querySelector('#team-slots [data-action="composition"]').click();
    await wait();
    assert(doc.querySelector("#share-menu-toggle")?.getAttribute("aria-label") === "Partager", "Libelle de survol du partage absent");
    assert(win.getComputedStyle(doc.querySelector("#share-menu-toggle"), "::before").backgroundColor.includes("66, 216, 142"), "Luminescence verte du partage absente");
    assert(doc.querySelectorAll("#composition-list .composition-add-slot").length === 5, "Les slots Pokemon libres ne sont pas affiches");
    assert(Array.from(doc.querySelectorAll("#composition-list .composition-add-slot")).every((slot) => !slot.textContent.trim()), "Un slot Pokemon libre contient encore du texte");
    assert(win.getComputedStyle(doc.querySelector("#composition-list .composition-add-slot img")).width === "72px", "Le logo d'ajout Pokemon n'est pas agrandi");
    frame.hidden = false;
    Object.assign(frame.style, { position: "fixed", left: "-10000px", top: "0", width: "915px", height: "412px" });
    await wait(50);
    const landscapeShellColumns = win.getComputedStyle(doc.querySelector(".app-shell")).gridTemplateColumns.trim().split(/\s+/);
    const landscapePokemonColumns = win.getComputedStyle(doc.querySelector("#composition-list")).gridTemplateColumns.trim().split(/\s+/);
    assert(landscapeShellColumns.length === 2, "Le paysage n'utilise pas un rail de navigation et une zone de contenu");
    assert(win.getComputedStyle(doc.querySelector(".app-header")).position === "sticky", "Le rail de navigation n'est pas ancré en paysage");
    assert(win.getComputedStyle(doc.querySelector(".app-header")).borderTopWidth === "0px", "Le rail gauche conserve encore son cadre");
