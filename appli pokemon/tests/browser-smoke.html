<!doctype html>
<meta charset="utf-8">
<title>KantoTeam smoke test</title>
<pre id="result">RUNNING</pre>
<iframe id="app" src="../index.html" hidden></iframe>
<script>
  const result = document.querySelector("#result");
  const frame = document.querySelector("#app");
  const wait = (ms = 80) => new Promise((resolve) => setTimeout(resolve, ms));
  const assert = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const loaded = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));

  (async () => {
    await loaded();
    const win = frame.contentWindow;
    win.localStorage.clear();
    const base = {
      selectedSlot: 0,
      activeView: "slots",
      teams: [null, null, null],
      customPokemon: [],
      sharedTeams: []
    };
    win.localStorage.setItem("kantoTeamState:v2", JSON.stringify({
      schemaVersion: 2,
      activeGame: "reforged",
      games: {
        reforged: { ...base, teams: [{ name: "Equipe Reforged", preferredSource: "reforged", pokemon: [], reservePokemonIds: [] }, null, null] },
        "pokemon-z": { ...base, teams: [{ name: "Equipe Z", preferredSource: "pokemon-z", pokemon: [{ instanceId: "z-bulbizarre", sourceId: "pokemon-z-1", pokemonZId: "pokemon-z-1", nationalId: 1, name: "Bulbizarre", types: ["Plante", "Poison"], attacks: ["Plante", "Poison"] }], reservePokemonIds: [] }, null, null] }
      }
    }));
    const reloaded = loaded();
    win.location.reload();
    await reloaded;
    await wait();

    const doc = frame.contentDocument;
    assert(doc.querySelectorAll("#team-slots .slot-card").length === 3, "Reforged doit afficher 3 slots");
    const emptyTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/add-team-pokeball.png']");
    assert(emptyTeamPokeball, "L'icone add-team-pokeball n'est pas affectee au slot libre");
    assert(!emptyTeamPokeball.closest(".empty-team-slot").textContent.trim(), "Le slot d'equipe libre contient encore du texte");
    assert(win.getComputedStyle(emptyTeamPokeball).width === "82px", "Le logo du slot d'equipe libre n'est pas agrandi");
    const filledTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/team-pokeball.png']");
    assert(filledTeamPokeball, "L'icone team-pokeball n'est pas affectee a l'equipe existante");
    assert(filledTeamPokeball.dataset.themeFallback === "assets/pokeball.png", "Le repli de team-pokeball est absent");
    assert(doc.querySelector("#team-slots").textContent.includes("Equipe Reforged"), "Equipe Reforged absente");
    const reforgedSlotButton = doc.querySelector('#team-slots [data-action="analysis"]');
    const reforgedButtonColor = win.getComputedStyle(reforgedSlotButton).color.match(/[\d.]+/g)?.slice(0, 3).map(Number) || [];
    assert(reforgedButtonColor.length === 3 && reforgedButtonColor.reduce((sum, value) => sum + value, 0) / 3 > 180, "Texte sombre sur les boutons de slot Reforged");
    doc.querySelector("#game-version-toggle").click();
    await wait(800);
    assert(doc.querySelectorAll("#team-slots .slot-card").length === 3, "Pokemon Z doit afficher 3 slots");
    assert(doc.querySelector("#team-slots").textContent.includes("Equipe Z"), "Equipe Z absente");
    assert(!doc.querySelector("#team-slots").textContent.includes("Equipe Reforged"), "Melange entre les banques");
    assert(doc.body.dataset.gameTheme === "pokemon-z", "Palette Pokemon Z non activee");
    assert(doc.querySelector("#open-shared-teams img")?.getAttribute("src") === "assets/share-pokeball_z.png", "Logo share-pokeball Z absent du partage");
    assert(win.getComputedStyle(doc.querySelector("#open-type-helper")).getPropertyValue("--feature-rgb").trim() === "126, 142, 255", "Couleur du Guide des types absente");
    assert(win.getComputedStyle(doc.querySelector("#manage-saved-pokemon")).getPropertyValue("--feature-rgb").trim() === "74, 197, 132", "Couleur des Pokemon sauvegardes absente");
    const zEmptyTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/add-team-pokeball.png']");
    assert(zEmptyTeamPokeball?.getAttribute("src") === "assets/add-team-pokeball_z.png", "La variante Z de add-team-pokeball n'est pas chargee");
    const zFilledTeamPokeball = doc.querySelector("#team-slots img[data-theme-asset='assets/team-pokeball.png']");
    assert(zFilledTeamPokeball?.getAttribute("src").endsWith("_z.png"), "La variante Z de l'icone d'equipe n'est pas chargee");
    assert(doc.querySelector("#app-title-logo").getAttribute("src") === "assets/Titre_Pokemon_Z.png", "Logo Pokemon Z non charge");
    assert(doc.querySelector("#catalog-select").options.length === 1018, "Catalogue Pokemon Z incomplet");
    const stored = JSON.parse(win.localStorage.getItem("kantoTeamState:v2"));
    assert(stored.activeGame === "pokemon-z", "Version active non persistee");
    assert(stored.games.reforged.teams.length === 3 && stored.games["pokemon-z"].teams.length === 3, "Les 6 slots ne sont pas repartis en 3 + 3");
    doc.querySelector('#team-slots [data-action="composition"]').click();
    await wait();
    assert(doc.querySelector("#share-menu-toggle")?.getAttribute("aria-label") === "Partager", "Libelle de survol du partage absent");
    assert(win.getComputedStyle(doc.querySelector("#share-menu-toggle"), "::before").backgroundColor.includes("66, 216, 142"), "Luminescence verte du partage absente");
    assert(doc.querySelectorAll("#composition-list .composition-add-slot").length === 5, "Les slots Pokemon libres ne sont pas affiches");
    assert(Array.from(doc.querySelectorAll("#composition-list .composition-add-slot")).every((slot) => !slot.textContent.trim()), "Un slot Pokemon libre contient encore du texte");
    assert(win.getComputedStyle(doc.querySelector("#composition-list .composition-add-slot img")).width === "72px", "Le logo d'ajout Pokemon n'est pas agrandi");
    doc.querySelector("#back-to-slots").click();
    await wait();
    doc.querySelector("#open-pokemon-search").click();
    assert(doc.querySelector("#game-version-switch").classList.contains("hidden"), "Le switch reste visible hors de la selection d'equipe");
    const query = doc.querySelector("#pokemon-search-query");
    query.value = "Carapuce";
    query.dispatchEvent(new win.Event("input", { bubbles: true }));
    await wait();
    const infoButton = doc.querySelector("#pokemon-search-results [data-pokemon-info-name]");
    assert(infoButton, "Bouton du guide d'obtention absent");
    infoButton.click();
    await wait(1800);
    assert(doc.querySelector("#pokemon-search-results .pokemon-acquisition-method"), "Guide d'obtention Pokemon Z non affiche");
    assert(doc.querySelector("#pokemon-search-results .pokemon-guide-version")?.textContent === "v2.12", "Vignette de version Pokemon Z absente");
    assert(!doc.querySelector("#pokemon-search-results .pokemon-guide-notes"), "La note Le Prodige est affichee a tort pour Carapuce");
    assert(doc.querySelector("#pokemon-search-results .pokemon-acquisition-method").textContent.includes("Savinion"), "Le lieu francais de Carapuce n'est pas applique");
    const tradePokemonLink = doc.querySelector("#pokemon-search-results [data-trade-pokemon-id='693']");
    assert(tradePokemonLink?.textContent === "Gamblast", "Clawitzer n'est pas traduit en Gamblast");
    tradePokemonLink.click();
    await wait(1800);
    assert(!doc.querySelector("#pokemon-trade-modal").classList.contains("hidden"), "La mini-fiche d'echange ne s'ouvre pas");
    assert(doc.querySelector("#pokemon-trade-modal-title")?.textContent === "Gamblast", "La mini-fiche n'affiche pas le bon Pokemon");
    assert(doc.querySelector("#pokemon-trade-modal .pokemon-trade-modal-sprite"), "Le sprite manque dans la mini-fiche");
    assert(doc.querySelector("#pokemon-trade-modal .pokemon-acquisition-method"), "Le lieu d'obtention manque dans la mini-fiche");
    doc.querySelector("#pokemon-trade-modal [data-close-trade-pokemon]").click();
    const mobileMethodColumns = win.getComputedStyle(doc.querySelector("#pokemon-search-results .pokemon-acquisition-method")).gridTemplateColumns.trim().split(/\s+/);
    assert(mobileMethodColumns.length === 1, "La methode d'obtention reste etroite sur mobile");
    doc.querySelector("#pokemon-search-results [data-pokemon-card-toggle]").click();
    const visibleMultiplier = doc.querySelector("#pokemon-search-results .multiplier.weak, #pokemon-search-results .multiplier.resist, #pokemon-search-results .multiplier.immune");
    const multiplierStyle = win.getComputedStyle(visibleMultiplier);
    const multiplierText = multiplierStyle.color.match(/[\d.]+/g)?.slice(0, 3).map(Number) || [];
    assert(multiplierText.length === 3 && multiplierText.reduce((sum, value) => sum + value, 0) / 3 < 115, "Multiplicateur trop clair sur le fond Pokemon Z");
    assert(multiplierStyle.backgroundColor.startsWith("rgb("), "Fond du multiplicateur Pokemon Z encore transparent");
    const lightBackground = (element) => {
      const values = frame.contentWindow.getComputedStyle(element).backgroundColor.match(/[\d.]+/g)?.slice(0, 3).map(Number) || [];
      return values.length === 3 && values.reduce((sum, value) => sum + value, 0) / 3 > 190;
    };
    assert(lightBackground(doc.querySelector("#pokemon-search-results .pokemon-info-panel")), "Fond sombre dans le detail d'obtention Pokemon Z");
    assert(lightBackground(doc.querySelector("#pokemon-search-results .pokemon-acquisition-method")), "Fond sombre dans une methode d'obtention Pokemon Z");
    query.value = "Herbizarre";
    query.dispatchEvent(new win.Event("input", { bubbles: true }));
    await wait();
    doc.querySelector("#pokemon-search-results [data-pokemon-info-name]").click();
    await wait(250);
    const evolutionPokemonLink = doc.querySelector("#pokemon-search-results [data-trade-pokemon-id='1']");
    assert(evolutionPokemonLink?.textContent === "Bulbizarre", "Bulbasaur n'est pas traduit dans la methode d'evolution");
    assert(!doc.querySelector("#pokemon-search-results .pokemon-info-panel").textContent.includes("Bulbasaur"), "Un nom anglais subsiste dans l'evolution d'Herbizarre");
    query.value = "Carvanha";
    query.dispatchEvent(new win.Event("input", { bubbles: true }));
    await wait();
    doc.querySelector("#pokemon-search-results [data-pokemon-info-name]").click();
    await wait(250);
    const carvanhaMethods = doc.querySelector("#pokemon-search-results .pokemon-info-panel")?.textContent || "";
    assert(carvanhaMethods.includes("Vieille Canne") && carvanhaMethods.includes("Roche-sur-Gliffe"), "La capture v2.12 absente du guide web n'est pas ajoutee pour Carvanha");
    doc.querySelector("#back-to-slots").click();
    await wait();
    doc.querySelector('#team-slots [data-action="simulation"]').click();
    await wait();
    const versusPanel = doc.querySelector("#simulation-panel");
    assert(lightBackground(versusPanel), "Fond sombre dans le panneau Versus Pokemon Z");
    const enemyCard = doc.querySelector("#mobile-versus-list .mobile-duel");
    const enemyBackground = enemyCard ? frame.contentWindow.getComputedStyle(enemyCard).backgroundImage : "absente";
    assert(enemyCard && !enemyBackground.includes("21, 26, 35"), `Carte adverse sombre dans le Versus Pokemon Z : ${enemyBackground}`);

    win.localStorage.clear();
    const legacy = {
      ...base,
      teams: [
        { name: "Ancienne Reforged", preferredSource: "reforged", pokemon: [], reservePokemonIds: [] },
        { name: "Ancienne Z", preferredSource: "pokemon-z", pokemon: [], reservePokemonIds: [] },
        { name: "Ancienne classique", preferredSource: "official", pokemon: [], reservePokemonIds: [] }
      ]
    };
    win.localStorage.setItem("kantoTeamState:v1", JSON.stringify(legacy));
    const migratedReload = loaded();
    win.location.reload();
    await migratedReload;
    await wait();
    const migrated = JSON.parse(win.localStorage.getItem("kantoTeamState:v2"));
    assert(win.localStorage.getItem("kantoTeamState:legacy:v1") === JSON.stringify(legacy), "Sauvegarde de securite v1 absente");
    assert(migrated.games.reforged.teams[0]?.name === "Ancienne Reforged", "Migration Reforged incorrecte");
    assert(migrated.games["pokemon-z"].teams[1]?.name === "Ancienne Z", "Migration Pokemon Z incorrecte");
    assert(!JSON.stringify(migrated).includes("Ancienne classique"), "Une equipe Kanto classique a ete injectee dans un profil");
    result.textContent = "PASS";
  })().catch((error) => {
    result.textContent = `FAIL: ${error.message}`;
  });
</script>
